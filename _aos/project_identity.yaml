# _aos/project_identity.yaml — Cross-Project Boundary Declaration
# ================================================================
# SSoT for project identity and boundary enforcement.
# Read by: validate_aos.sh (Check 12), .cursorrules, CLAUDE.md, activation prompts, prompt builder.
# Managed by: Team 00 + Team 100.
# Deployed to: _aos/project_identity.yaml in every AOS-managed project.
#
# TEMPLATE — replace placeholders with project-specific values.

project_id: "nimrod-bio"
display_name: "nimrod.bio — Personal Site (WordPress)"
domain: "wordpress"
profile: "L0"
language: he
hosting: upress

# Hub-spoke topology
is_hub: false
managed_projects: []

# Boundary enforcement
boundaries:
  # Directories this project's agents may write to (relative to repo root)
  allowed_write_roots:
    - "_aos/"
    - "_COMMUNICATION/"
    - "nimrod.bio/"
    - "research/"
    - "docs/"
    - "scripts/"
    - "sources/"

  # Patterns that must NEVER appear in tracked files (other project names, domains, imports)
  forbidden_patterns:
    - tiktrack
    - hobbithome
    - eyalamit
    - smallfarmsagents
    - agros-insite
    - microgreens

  # Documented exceptions to forbidden_patterns (validate_aos.sh Check 12 allowlist).
  # nimrod-bio is a personal portfolio/bio domain that LEGITIMATELY showcases Nimrod's
  # other projects as content (service sections, portfolio seed data). These are not
  # cross-project contamination. Approved by team_00 (2026-05-30, MSG-HUB-20260529-001
  # follow-up). Any forbidden pattern appearing OUTSIDE these file/pattern pairs still fails.
  forbidden_patterns_allowlist:
    # path: "*" = domain-wide exemption (pattern is legitimate content everywhere in this repo).
    # These projects are showcased pervasively across the portfolio/bio site (service sections,
    # portfolio seed data, QA visual-diffs, design handoffs) — not cross-project contamination.
    # hobbithome + eyalamit stay enforced (not showcased) so genuine unexpected leaks still fail.
    - path: "*"
      patterns: [tiktrack, smallfarmsagents, agros-insite, microgreens]
      reason: "Portfolio/bio domain — Nimrod's projects are showcased content throughout the site."

  # Instruction for agents encountering cross-project work
  cross_project_routing: "~/Documents/_agent_comm/outbox/"

  push_scope: repo_only

  hub_routing: "via_team_00"
