<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="tiktrack — תצוגה מקדימה של יומן מסחר">
  <title>tiktrack — יומן מסחר · דמו</title>
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .sans { font-family: "Assistant", system-ui, sans-serif; }
    </style>
    <linearGradient id="ttArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c46a3e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c46a3e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- dark know panel -->
  <rect width="800" height="500" fill="#3a2417"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#9a4f2b"/>

  <!-- header -->
  <text x="760" y="46" text-anchor="end" class="mono" font-size="17" font-weight="600" fill="#f5f3ec">tiktrack · יומן מסחר</text>
  <circle cx="44" cy="40" r="11" fill="#c46a3e"/>
  <path d="M39 40 l4 4 l7 -8" fill="none" stroke="#3a2417" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="64" x2="760" y2="64" stroke="#9a4f2b" stroke-opacity="0.6"/>

  <!-- chart panel -->
  <rect x="40" y="86" width="510" height="240" rx="12" fill="#2c1b11" stroke="#9a4f2b" stroke-opacity="0.7"/>
  <text x="530" y="112" text-anchor="end" class="mono" font-size="12" letter-spacing="1" fill="#e0a07c">P&amp;L · 30D</text>

  <!-- y axis ticks / gridlines -->
  <g stroke="#5a3a25" stroke-width="1">
    <line x1="78" y1="140" x2="528" y2="140"/>
    <line x1="78" y1="190" x2="528" y2="190"/>
    <line x1="78" y1="240" x2="528" y2="240"/>
    <line x1="78" y1="290" x2="528" y2="290"/>
  </g>
  <g class="mono" font-size="10" fill="#b07d5e" text-anchor="end">
    <text x="70" y="144">+8K</text>
    <text x="70" y="194">+4K</text>
    <text x="70" y="244">0</text>
    <text x="70" y="294">-2K</text>
  </g>

  <!-- area + sparkline trending up -->
  <polygon points="78,250 130,238 182,256 234,210 286,224 338,176 390,192 442,150 494,164 528,128 528,290 78,290"
           fill="url(#ttArea)"/>
  <polyline points="78,250 130,238 182,256 234,210 286,224 338,176 390,192 442,150 494,164 528,128"
            fill="none" stroke="#c46a3e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="528" cy="128" r="5" fill="#f5f3ec" stroke="#c46a3e" stroke-width="2.5"/>

  <!-- x axis ticks -->
  <g class="mono" font-size="10" fill="#b07d5e" text-anchor="middle">
    <text x="130" y="310">01</text>
    <text x="286" y="310">15</text>
    <text x="442" y="310">30</text>
  </g>

  <!-- KPI tiles (right column) -->
  <g>
    <rect x="566" y="86" width="194" height="74" rx="10" fill="#2c1b11" stroke="#9a4f2b" stroke-opacity="0.7"/>
    <text x="744" y="116" text-anchor="end" class="mono" font-size="26" font-weight="700" fill="#e8a877">+18.4%</text>
    <text x="744" y="140" text-anchor="end" class="sans" font-size="12" fill="#b07d5e">תשואה · החודש</text>
  </g>
  <g>
    <rect x="566" y="172" width="194" height="74" rx="10" fill="#2c1b11" stroke="#9a4f2b" stroke-opacity="0.7"/>
    <text x="744" y="202" text-anchor="end" class="mono" font-size="26" font-weight="700" fill="#f5f3ec">63%</text>
    <text x="744" y="226" text-anchor="end" class="sans" font-size="12" fill="#b07d5e">אחוז הצלחה · 142 עסקאות</text>
  </g>
  <g>
    <rect x="566" y="258" width="194" height="68" rx="10" fill="#2c1b11" stroke="#9a4f2b" stroke-opacity="0.7"/>
    <text x="744" y="288" text-anchor="end" class="mono" font-size="22" font-weight="700" fill="#e8a877">1 : 2.7</text>
    <text x="744" y="310" text-anchor="end" class="sans" font-size="12" fill="#b07d5e">יחס סיכון/סיכוי</text>
  </g>

  <!-- journal rows -->
  <text x="760" y="358" text-anchor="end" class="mono" font-size="12" letter-spacing="1" fill="#e0a07c">יומן · JOURNAL</text>
  <!-- row 1 -->
  <rect x="40" y="370" width="720" height="44" rx="9" fill="#2c1b11" stroke="#9a4f2b" stroke-opacity="0.5"/>
  <rect x="50" y="382" width="8" height="20" rx="2" fill="#5fae6a"/>
  <text x="744" y="397" text-anchor="end" class="sans" font-size="14" font-weight="600" fill="#f5f3ec">לונג · מדד · יציאה לפי תכנית</text>
  <text x="200" y="397" text-anchor="start" class="mono" font-size="13" fill="#7fae6a">+1,240 ₪</text>
  <text x="120" y="397" text-anchor="start" class="mono" font-size="11" fill="#b07d5e">28.05</text>
  <!-- row 2 -->
  <rect x="40" y="422" width="720" height="44" rx="9" fill="#2c1b11" stroke="#9a4f2b" stroke-opacity="0.5"/>
  <rect x="50" y="434" width="8" height="20" rx="2" fill="#c4623e"/>
  <text x="744" y="449" text-anchor="end" class="sans" font-size="14" font-weight="600" fill="#f5f3ec">שורט · נגד מגמה · סטופ נגע</text>
  <text x="200" y="449" text-anchor="start" class="mono" font-size="13" fill="#d9764e">-380 ₪</text>
  <text x="120" y="449" text-anchor="start" class="mono" font-size="11" fill="#b07d5e">29.05</text>

  <!-- honest DEMO tag -->
  <rect x="40" y="474" width="118" height="20" rx="10" fill="#9a4f2b"/>
  <text x="99" y="488" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#f5f3ec">דמו · DEMO</text>
