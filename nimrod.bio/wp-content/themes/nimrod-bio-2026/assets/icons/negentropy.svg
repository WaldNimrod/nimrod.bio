<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-hidden="true" class="negentropy">
  <!--
    Negentropy backdrop: entropy -> connection (mockup Precision §3).
    Right field = scattered loose dots + faint lattice (high entropy) whose
    flow lines pull toward an ordered TRIAD of three world baskets
    (soil/know/code), joined by color-coded spokes, with a single spark at
    the convergence. Faint, token-driven palette (resolves because this SVG
    is inlined into the page): line, ink-soft, w-soil/know/code, spark, paper
    custom properties. World colors: soil #6a8a3a, know #c46a3e, code #2d8a8c, spark #d23a2e.
  -->

  <!-- faint lattice (right field, the disordered region) -->
  <g stroke="var(--ink-soft, #4a4844)" stroke-width="1" opacity="0.16">
    <path d="M760 80 L880 130 L800 200"/>
    <path d="M980 70 L1040 140 L960 190"/>
    <path d="M1080 240 L1140 110 L1040 60"/>
    <path d="M880 130 L980 70"/>
    <path d="M800 200 L900 280 L1010 250"/>
  </g>

  <!-- flow lines pulling the scattered dots toward the triad convergence (~x=520) -->
  <g class="flows" stroke="var(--line, #d6d2c2)" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.7">
    <path class="flow" d="M760 90 Q620 150 540 178"/>
    <path class="flow" d="M820 250 Q640 220 540 192"/>
    <path class="flow" d="M980 80 Q700 140 548 182"/>
    <path class="flow" d="M1040 200 Q760 200 552 186"/>
    <path class="flow" d="M1120 130 Q820 170 556 184"/>
  </g>

  <!-- scattered loose dots (entropy) — ink-soft, varied size & opacity -->
  <g fill="var(--ink-soft, #4a4844)">
    <circle class="ent" cx="760" cy="88"  r="6" opacity="0.40"/>
    <circle class="ent" cx="838" cy="150" r="4" opacity="0.30"/>
    <circle class="ent" cx="792" cy="232" r="7" opacity="0.42"/>
    <circle class="ent" cx="900" cy="60"  r="3" opacity="0.26"/>
    <circle class="ent" cx="932" cy="196" r="5" opacity="0.34"/>
    <circle class="ent" cx="876" cy="288" r="4" opacity="0.28"/>
    <circle class="ent" cx="996" cy="110" r="6" opacity="0.38"/>
    <circle class="ent" cx="1022" cy="244" r="4" opacity="0.28"/>
    <circle class="ent" cx="1080" cy="72"  r="5" opacity="0.34"/>
    <circle class="ent" cx="1108" cy="182" r="3" opacity="0.24"/>
    <circle class="ent" cx="1140" cy="276" r="5" opacity="0.32"/>
    <circle class="ent" cx="1168" cy="128" r="4" opacity="0.26"/>
    <circle class="ent" cx="700" cy="180" r="3" opacity="0.24"/>
    <circle class="ent" cx="660" cy="120" r="4" opacity="0.28"/>
    <circle class="ent" cx="640" cy="248" r="3" opacity="0.22"/>
    <circle class="ent" cx="1056" cy="316" r="4" opacity="0.26"/>
    <circle class="ent" cx="952" cy="320" r="3" opacity="0.22"/>
    <circle class="ent" cx="1132" cy="40"  r="3" opacity="0.22"/>
  </g>

  <!-- ordered TRIAD — three world baskets joined by color-coded spokes -->
  <g class="triad">
    <!-- connector triangle (the joined seam) -->
    <path d="M520 70 L610 290 L430 290 Z" stroke="var(--ink-soft, #4a4844)" stroke-width="2" opacity="0.4"/>
    <!-- spokes from convergence to each world, color-coded -->
    <line x1="520" y1="182" x2="520" y2="70"  stroke="var(--w-soil, #6a8a3a)" stroke-width="1.5" opacity="0.4"/>
    <line x1="520" y1="182" x2="430" y2="290" stroke="var(--w-code, #2d8a8c)" stroke-width="1.5" opacity="0.4"/>
    <line x1="520" y1="182" x2="610" y2="290" stroke="var(--w-know, #c46a3e)" stroke-width="1.5" opacity="0.4"/>

    <!-- single spark at the convergence -->
    <circle cx="520" cy="182" r="7" fill="var(--spark, #d23a2e)"/>

    <!-- soil basket (top) — paper-filled disc + world-soil ring + basket emblem -->
    <circle cx="520" cy="70" r="30" fill="var(--paper, #f5f3ec)" stroke="var(--w-soil, #6a8a3a)" stroke-width="2"/>
    <g stroke="var(--w-soil, #6a8a3a)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M508 64 H532 L529 82 A2 2 0 0 1 527 84 H513 A2 2 0 0 1 511 82 Z"/>
      <path d="M506 64 H534"/>
      <path d="M520 64 V58"/>
    </g>

    <!-- code basket (bottom-left) -->
    <circle cx="430" cy="290" r="30" fill="var(--paper, #f5f3ec)" stroke="var(--w-code, #2d8a8c)" stroke-width="2"/>
    <g stroke="var(--w-code, #2d8a8c)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M418 284 H442 L439 302 A2 2 0 0 1 437 304 H423 A2 2 0 0 1 421 302 Z"/>
      <path d="M416 284 H444"/>
      <circle cx="430" cy="278" r="2.5"/>
    </g>

    <!-- know basket (bottom-right) -->
    <circle cx="610" cy="290" r="30" fill="var(--paper, #f5f3ec)" stroke="var(--w-know, #c46a3e)" stroke-width="2"/>
    <g stroke="var(--w-know, #c46a3e)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M598 284 H622 L619 302 A2 2 0 0 1 617 304 H603 A2 2 0 0 1 601 302 Z"/>
      <path d="M596 284 H624"/>
      <path d="M604 284 Q610 276 616 284"/>
    </g>
  </g>
</svg>
